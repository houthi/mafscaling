<html>\
<h3>Injector Tuning</h3>\
<p>Load log file(s) containing battery voltage, injector pulse width, short and long term fuel trims.\
Paste the current injector latency table and current scale value. After loading logs and pressing GO, the tool calculates latency corrections per voltage and a new injector scale.\
Results are shown with the scale tables on the left and latency tables on the right.</p>\
